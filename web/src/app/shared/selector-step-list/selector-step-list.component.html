@if (items().length === 0) {
  <p class="selector-step-list__empty">{{ emptyLabel() }}</p>
} @else {
  <div
    class="selector-step-list"
    [class.selector-step-list--grid]="layout() === 'grid'"
    [class.selector-step-list--grid-mobile]="layout() === 'grid' && twoColumnsOnMobile()"
  >
    @for (item of items(); track item.id) {
      <button type="button" class="selector-step-list__card" (click)="select.emit(item)">
        @if (hasCrest(item)) {
          <span class="selector-step-list__icon">
            <img
              class="selector-step-list__crest"
              [src]="item.crest"
              alt=""
              aria-hidden="true"
              (error)="onCrestError(item.id)"
            />
          </span>
        }
        <span class="selector-step-list__name">
          <span class="selector-step-list__name-text">{{ item.name }}</span>
        </span>
        <span class="material-symbols-outlined selector-step-list__chevron" aria-hidden="true">chevron_right</span>
      </button>
    }
  </div>
}
